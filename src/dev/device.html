<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Device Frame</title>
    <style>
      body { margin: 0; background: #444; display: grid; place-items: start; padding: 0; }
      iframe { border: 0; display: block; background: #000; }
    </style>
  </head>
  <body>
    <!--
      Dev only: shows a page at an exact phone size, since headless Chrome can't go below 500px.
      ?w=844&h=390&src=/demo%3Fsize%3D64   &guest=1 skips the landing page   &auth=login opens the dialog
    -->
    <script>
      const q = new URLSearchParams(location.search);
      if (q.get('guest') === '1') localStorage.setItem('citybuilder.guest', '1');
      else if (q.get('guest') === '0') localStorage.removeItem('citybuilder.guest');
      const f = document.createElement('iframe');
      f.width = q.get('w') || '844';
      f.height = q.get('h') || '390';
      f.src = q.get('src') || '/';
      document.body.appendChild(f);
    </script>
  </body>
</html>
