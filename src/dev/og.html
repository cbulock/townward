<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG Image</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; }
      .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #ece4d3;
        background: radial-gradient(ellipse 70% 80% at 72% 45%, transparent 30%, #0e1820 80%),
          linear-gradient(rgba(236,228,211,.12) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(90deg, rgba(236,228,211,.12) 1px, transparent 1px) 0 0 / 48px 48px, #0e1820; }
      .copy { position: absolute; left: 72px; top: 150px; width: 520px; }
      .mark { font: 800 34px 'Bricolage Grotesque'; letter-spacing: -0.02em; }
      .mark::before { content: ''; display: inline-block; width: 16px; height: 16px; margin-right: 14px; background: #f0b23e; transform: rotate(45deg) translateY(-3px); }
      h1 { margin: 36px 0 22px; font: 800 64px/0.98 'Bricolage Grotesque'; letter-spacing: -0.035em; }
      p { margin: 0; color: #f0b23e; font: 500 20px 'IBM Plex Mono'; letter-spacing: 0.04em; text-transform: uppercase; }
      .city { position: absolute; right: -10px; top: 10px; width: 690px; }
      .city canvas { width: 100% !important; }
    </style>
  </head>
  <body>
    <!-- Dev only: the 1200×630 social share image (public/og.png), screenshotted from here. -->
    <div class="og">
      <div class="copy">
        <div class="mark">Openpolis</div>
        <h1>Lay a road.<br />A city moves in.</h1>
        <p>Free city builder · in your browser</p>
      </div>
      <div class="city" id="city"></div>
    </div>
    <script type="module" src="./og.tsx"></script>
  </body>
</html>
