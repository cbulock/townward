# Local Postgres for the save server (docs/specs/saving.md). Start: docker compose up -d
# The whole app on a server (docs/deploy.md): docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: citybuilder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citybuilder}
      POSTGRES_DB: citybuilder
    # Localhost only: Docker's published ports skip the host firewall, so never expose 5432.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citybuilder']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: postgres://citybuilder:${POSTGRES_PASSWORD:-citybuilder}@postgres:5432/citybuilder
      # One reverse proxy (your HTTPS server) in front of the app.
      TRUST_PROXY: '1'
    # Localhost only: put your HTTPS reverse proxy (nginx, etc.) in front of it.
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
